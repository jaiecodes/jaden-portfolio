<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#030A11" />
    <meta name="color-scheme" content="dark light" />
    <!-- Apply the saved screen mode before first paint (see useScreenMode). -->
    <script>
      try {
        if (localStorage.getItem("screen-mode") === "day") document.documentElement.dataset.mode = "day";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jaden-portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
